name: 每週合規來源自動檢查 (Weekly Compliance Source Check)

# 設計原則：
#   - 這個workflow絕對不會直接把AI草擬的內容合併進main分支。
#   - 它唯一能做的事情是：跑檢查腳本 -> 如果有偵測到變動 -> 開一個Pull Request。
#   - PR一定需要人工檢視、核對原文、按下「Merge」才會真正生效。
#   - 沒有偵測到變動時，完全不會建立PR，避免製造噪音PR。

on:
  schedule:
    # 每週一 UTC 03:00（台灣時間週一上午11:00）自動執行一次
    - cron: "0 3 * * 1"
  workflow_dispatch:
    # 允許在GitHub網頁上手動點擊「Run workflow」立刻觸發一次檢查，
    # 方便測試或想立刻確認某個來源是否已更新時使用。

permissions:
  contents: write
  pull-requests: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests anthropic

      - name: 執行每週來源檢查腳本
        id: check
        env:
          # 這個金鑰要在 GitHub repo 的 Settings -> Secrets and variables ->
          # Actions -> New repository secret 裡設定，名稱必須是 ANTHROPIC_API_KEY。
          # 絕對不要把金鑰直接寫在這個yml檔案裡。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m compliance_watch.check_sources

      - name: 若有偵測到變動，開立Pull Request供人工審核
        if: steps.check.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(compliance): 每週自動檢查偵測到來源變動，附AI草擬內容待審核"
          title: "🔍 每週合規來源檢查：偵測到內容變動（需人工審核）"
          body: |
            這是每週自動排程檢查產生的Pull Request。

            **⚠️ 重要：本PR包含的所有AI草擬內容都尚未經過人工驗證，合併前請務必：**
            1. 打開 `compliance_watch/report.md` 閱讀本次檢查摘要
            2. 對照 `compliance_watch/proposed_chunks.json` 中每一筆草稿的
               `full_text_for_review`（原始抓取全文）與 `proposed_chunk.original_text_snippet`
               （AI摘錄的原文片段），確認AI沒有竄改或誤引原文
            3. 確認 `proposed_chunk` 的分類（topic/jurisdiction/product_scope等）正確
            4. 若確認無誤，再自行將對應內容手動整合進 `veloguard_multicountry_chunks.json`
               （本PR本身不會自動修改該檔案，只提供草稿與比對資料）
            5. 全部確認後才可以合併（Merge）此PR

            合併後，Streamlit Community Cloud 會自動從 `main` 分支重新部署最新版本。
          branch: compliance-watch/weekly-update
          add-paths: |
            compliance_watch/report.md
            compliance_watch/proposed_chunks.json
            compliance_watch/snapshot_store.json

      - name: 若無變動，直接把snapshot時間戳記提交回main（不開PR）
        if: steps.check.outputs.changes_detected == 'false'
        run: |
          git config user.name "veloguard-compliance-bot"
          git config user.email "actions@github.com"
          git add compliance_watch/snapshot_store.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(compliance): 每週檢查完成，本次無內容變動（僅更新檢查時間戳記）"
            git push
          else
            echo "snapshot沒有任何變化，不需要commit。"
          fi
